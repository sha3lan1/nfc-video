<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>Video</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: radial-gradient(circle, #202020, #080808 75%);
      font-family: Arial, sans-serif;
      color: white;
    }

    main {
      width: 100%;
      max-width: 850px;
      text-align: center;
    }

    .frame {
      overflow: hidden;
      border: 1px solid #444;
      border-radius: 14px;
      background: #000;
      box-shadow: 0 15px 50px #0009;
    }

    video {
      display: block;
      width: 100%;
      max-height: 80vh;
      background: #000;
    }

    button {
      margin-top: 20px;
      padding: 13px 26px;
      border: 1px solid #888;
      border-radius: 30px;
      background: #181818;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main>
    <div class="frame">
      <video id="video" autoplay muted playsinline controls>
        <source src="video.MP4" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
      </video>
    </div>

    <button id="sound">تشغيل الصوت</button>
  </main>

  <script>
    const video = document.getElementById("video");
    const button = document.getElementById("sound");

    video.play().catch(() => {});

    button.addEventListener("click", async () => {
      video.muted = false;

      try {
        await video.play();
        button.textContent = "الصوت يعمل";
      } catch (error) {
        button.textContent = "اضغط تشغيل الفيديو";
      }
    });
  </script>
</body>
</html>
